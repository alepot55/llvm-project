# Throwaway workflow on a fork branch: build mlir-opt with assertions and run the
# four reduced cases from llvm/llvm-project#218212. Not for upstream.
name: shard-axis-repro

on:
  push:
    branches: [ci/shard-repro]
  workflow_dispatch:

jobs:
  repro:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build ccache lld clang
          ccache --version | head -1

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: shard-repro-ccache-${{ github.sha }}
          restore-keys: |
            shard-repro-ccache-

      - name: Configure
        run: |
          cmake -G Ninja -S llvm -B build \
            -DLLVM_ENABLE_PROJECTS=mlir \
            -DLLVM_TARGETS_TO_BUILD=host \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_ENABLE_ASSERTIONS=ON \
            -DBUILD_SHARED_LIBS=ON \
            -DLLVM_OPTIMIZED_TABLEGEN=ON \
            -DLLVM_USE_LINKER=lld \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build mlir-opt
        run: |
          export CCACHE_DIR=~/.ccache
          ccache -z
          ninja -C build mlir-opt mlir-opt FileCheck not
          ccache -s | head -5

      - name: Provenance
        run: |
          echo "HEAD:      $(git rev-parse HEAD)"
          echo "mlir-opt:  $(md5sum build/bin/mlir-opt | cut -c1-12)"
          echo "assertions in the build:"
          grep -n 'LLVM_ENABLE_ASSERTIONS' build/CMakeCache.txt || true
          echo "--- the four call sites on this checkout ---"
          grep -n 'verifyScatterOrSliceOperandAndResultShape(\|verifyAllToAllOperandAndResultShape(' \
            mlir/lib/Dialect/Shard/IR/ShardOps.cpp

      - name: Write the reduced cases
        run: |
          mkdir -p /tmp/repro
          # Round 1 used shrinking result shapes, so the generic per-axis loop in
          # verifyScatterOrSliceOperandAndResultShape rejected them before the axis
          # was ever used. With an out-of-range tensorAxis that loop compares EVERY
          # axis, so operand and result must have the SAME shape to get past it and
          # reach getDimSize(tensorAxis).
          cat > /tmp/repro/scatter.mlir <<'EOM'
          shard.grid @grid0(shape = 2x2x4)
          func.func @scatter_axis_out_of_bounds(%arg0 : tensor<3x4xf32>) -> tensor<3x4xf32> {
            %0 = shard.scatter %arg0 on @grid0 grid_axes = [2]
              scatter_dim = 5 root = [1]
              : (tensor<3x4xf32>) -> tensor<3x4xf32>
            return %0 : tensor<3x4xf32>
          }
          EOM
          cat > /tmp/repro/all_slice.mlir <<'EOM'
          shard.grid @grid0(shape = 2x2x4)
          func.func @all_slice_axis_out_of_bounds(%arg0 : tensor<3x4xf32>) -> tensor<3x4xf32> {
            %0 = shard.all_slice %arg0 on @grid0 grid_axes = [2] slice_axis = 5
              : tensor<3x4xf32> -> tensor<3x4xf32>
            return %0 : tensor<3x4xf32>
          }
          EOM
          cat > /tmp/repro/all_to_all.mlir <<'EOM'
          shard.grid @grid4(shape = 3)
          func.func @all_to_all_axis_out_of_bounds(%arg0 : tensor<3x6xi8>) -> tensor<3x6xi8> {
            %0 = shard.all_to_all %arg0 on @grid4
              split_axis = 5 concat_axis = 0
              : tensor<3x6xi8> -> tensor<3x6xi8>
            return %0 : tensor<3x6xi8>
          }
          EOM
          cat > /tmp/repro/reduce_scatter.mlir <<'EOM'
          shard.grid @grid0(shape = 2x2x4)
          func.func @reduce_scatter_axis_out_of_bounds(%arg0 : tensor<3x4xf32>) -> tensor<3x4xf64> {
            %0 = shard.reduce_scatter %arg0 on @grid0 grid_axes = [2]
              reduction = max scatter_dim = 5
              : tensor<3x4xf32> -> tensor<3x4xf64>
            return %0 : tensor<3x4xf64>
          }
          EOM
          cat > /tmp/repro/gather.mlir <<'EOM'
          shard.grid @grid0(shape = 2x2x4)
          func.func @gather_axis_out_of_bounds(%arg0 : tensor<3x4xf32>) -> tensor<3x4xf32> {
            %0 = shard.gather %arg0 on @grid0 grid_axes = [2] gather_axis = 5 root = [1]
              : (tensor<3x4xf32>) -> tensor<3x4xf32>
            return %0 : tensor<3x4xf32>
          }
          EOM
          sed -i 's/^          //' /tmp/repro/*.mlir
          echo "--- scatter.mlir ---"; cat /tmp/repro/scatter.mlir

      - name: Run them
        run: |
          for f in scatter all_slice all_to_all reduce_scatter gather; do
            echo "=============== $f ==============="
            set +e
            ./build/bin/mlir-opt /tmp/repro/$f.mlir -o /dev/null 2>/tmp/repro/$f.err
            echo "rc=$?"
            set -e
            head -6 /tmp/repro/$f.err
            echo
          done

      - name: check-mlir-dialect-shard
        run: |
          ninja -C build check-mlir-dialect-shard 2>&1 | tail -25

      - name: check-mlir
        run: |
          ninja -C build check-mlir 2>&1 | tail -30
